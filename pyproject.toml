[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "producthunt-trend-analysis"
version = "0.1.0"
description = "Reproducible, rate-limit-aware Product Hunt ingestion and trend analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
ph-trends = "ph_trends.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ph_trends"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
